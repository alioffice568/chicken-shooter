
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VIP Chicken Shooter</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;align-items:flex-start;pointer-events:none;font-weight:bold;font-size:12px;text-shadow:0 0 8px #00eaff}
.stat{background:#101b36dd;border:1px solid #00d9ff;border-radius:9px;padding:7px}
#settingsBtn,#soundBtn{position:absolute;top:67px;border:1px solid #00eaff;background:#102447;color:white;padding:8px 10px;border-radius:9px;font-weight:bold;font-size:11px}
#settingsBtn{right:8px}
#soundBtn{left:8px}
#settings{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,330px);background:#0a1530f5;border:2px solid #00eaff;border-radius:18px;padding:20px;z-index:5;box-shadow:0 0 25px #00d9ff66}
#settings h2{text-align:center;color:#00eaff;margin:0 0 18px}
.option{display:flex;align-items:center;justify-content:space-between;margin:15px 0;font-size:14px;font-weight:bold}
button{cursor:pointer}
.toggle,.mainbtn{border:1px solid #00eaff;background:#132d51;color:white;padding:9px 13px;border-radius:8px;font-weight:bold}
.mainbtn{display:block;width:100%;margin-top:16px;background:#006e9b}
#message{position:absolute;top:42%;width:100%;text-align:center;font-size:26px;font-weight:900;color:#ffe76b;text-shadow:0 0 15px #ff7300;pointer-events:none}
#hint{position:absolute;bottom:8px;width:100%;text-align:center;font-size:10px;color:#a9c7ff;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">SCORE: <span id="score">0</span></div>
  <div class="stat">LEVEL: <span id="level">1</span></div>
  <div class="stat">HEALTH: <span id="health">100</span>%</div>
</div>

<button id="soundBtn">SOUND: ON</button>
<button id="settingsBtn">⚙ SETTINGS</button>

<div id="settings">
  <h2>GAME SETTINGS</h2>
  <div class="option"><span>BACKGROUND MUSIC</span><button class="toggle" id="musicToggle">ON</button></div>
  <div class="option"><span>CHICKEN SOUNDS</span><button class="toggle" id="chickenToggle">ON</button></div>
  <div class="option"><span>BULLET SOUNDS</span><button class="toggle" id="bulletToggle">ON</button></div>
  <button class="mainbtn" id="resumeBtn">RESUME GAME</button>
</div>

<div id="message">VIP CHICKEN SHOOTER</div>
<div id="hint">DRAG ANYWHERE TO MOVE • AUTO FIRE ENABLED</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

let W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.y=H-75;
  player.x=Math.max(25,Math.min(W-25,player.x||W/2));
}
const settings={music:true,chicken:true,bullets:true};
let settingsOpen=false,gameOver=false,started=false;
let score=0,level=1,health=100,lastTime=0,fireTimer=0,eggTimer=0;
let chickens=[],bullets=[],eggs=[],particles=[],stars=[];
let waveDirection=1,waveSpeed=45;
let audio=null,musicTimer=null,musicStep=0;

const player={x:innerWidth/2,y:innerHeight-75,r:18};
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function initAudio(){
  if(!audio){
    try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  }
  if(audio && audio.state==="suspended")audio.resume();
  startMusic();
}
function tone(freq,duration,type="sine",volume=.035){
  if(!audio)return;
  try{
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(volume,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+duration);
  }catch(e){}
}
function startMusic(){
  if(musicTimer||!settings.music||!audio)return;
  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  musicTimer=setInterval(()=>{
    if(settings.music&&!settingsOpen&&!gameOver){
      tone(notes[musicStep%notes.length],.22,"triangle",.012);
      musicStep++;
    }
  },260);
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
}
function soundBullet(){if(settings.bullets)tone(760,.07,"square",.018)}
function soundChicken(){if(settings.chicken){tone(240,.12,"triangle",.04);setTimeout(()=>tone(180,.1,"triangle",.025),70)}}
function soundExplosion(){if(settings.chicken){tone(95,.2,"sawtooth",.055);tone(55,.25,"triangle",.03)}}
function soundLevel(){tone(520,.12);setTimeout(()=>tone(700,.14),110);setTimeout(()=>tone(920,.2),220)}

function makeStars(){
  stars=[];
  for(let i=0;i<90;i++)stars.push({x:rand(0,W),y:rand(0,H),s:rand(.5,2),v:rand(8,28)});
}
function spawnWave(){
  chickens=[];
  const cols=Math.max(5,Math.min(9,Math.floor(W/43)));
  const rows=Math.min(5+Math.floor((level-1)/3),8);
  const gap=Math.min(39,(W-30)/cols);
  const total=cols*gap;
  const startX=(W-total)/2+gap/2;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      chickens.push({
        x:startX+c*gap,y:105+r*31,
        homeX:startX+c*gap,homeY:105+r*31,
        r:12,alive:true,phase:rand(0,6.28),
        hue:(r*27+c*13+level*9)%360
      });
    }
  }
  waveDirection=Math.random()<.5?1:-1;
  waveSpeed=35+Math.min(level*2,110);
  eggTimer=0;
}
function newGame(){
  score=0;level=1;health=100;gameOver=false;started=true;
  bullets=[];eggs=[];particles=[];
  player.x=W/2;player.y=H-75;
  spawnWave();updateHUD();
  $("message").style.display="none";
}
function updateHUD(){
  $("score").textContent=score;
  $("level").textContent=level;
  $("health").textContent=health;
}
function addParticles(x,y,color,count=9){
  for(let i=0;i<count;i++)particles.push({
    x,y,vx:rand(-100,100),vy:rand(-100,100),
    life:rand(.2,.65),max:.65,color,size:rand(2,4)
  });
}
function fire(){
  const count=Math.min(7,1+Math.floor((level-1)/3));
  const spread=8;
  for(let i=0;i<count;i++){
    const offset=(i-(count-1)/2)*spread;
    bullets.push({x:player.x+offset,y:player.y-22,v:470+Math.min(level*3,230),r:3});
  }
  soundBullet();
}
function loseHealth(amount){
  health=Math.max(0,health-amount);
  updateHUD();
  if(health<=0){
    gameOver=true;
    $("message").innerHTML="GAME OVER<br><span style='font-size:16px'>TAP TO PLAY AGAIN</span>";
    $("message").style.display="block";
    stopMusic();
  }
}
function nextLevel(){
  level++;
  soundLevel();
  $("message").textContent="LEVEL "+level+"!";
  $("message").style.display="block";
  setTimeout(()=>{
    if(!gameOver && !settingsOpen)$("message").style.display="none";
  },850);
  spawnWave();
  updateHUD();
}

function update(dt){
  if(settingsOpen||gameOver||!started)return;

  // Stars move only as a background effect.
  for(const s of stars){
    s.y+=s.v*dt;
    if(s.y>H){s.y=0;s.x=rand(0,W)}
  }

  // CHICKENS STAY IN THE TOP ZONE AND ONLY MOVE LEFT OR RIGHT.
  // Their vertical position is never changed.
  let left=Infinity,right=-Infinity;
  for(const c of chickens){
    if(!c.alive)continue;
    left=Math.min(left,c.x);
    right=Math.max(right,c.x);
  }
  const margin=18;
  if(left!==Infinity){
    if(right>=W-margin && waveDirection>0)waveDirection=-1;
    if(left<=margin && waveDirection<0)waveDirection=1;
  }
  for(const c of chickens){
    if(!c.alive)continue;
    c.x+=waveDirection*waveSpeed*dt;
    c.phase+=dt*4;
  }

  // Player automatically fires.
  fireTimer-=dt;
  if(fireTimer<=0){
    fire();
    fireTimer=Math.max(.12,.34-level*.004);
  }

  // Chicken eggs fall; chickens themselves never descend.
  eggTimer-=dt;
  if(eggTimer<=0 && chickens.some(c=>c.alive)){
    const alive=chickens.filter(c=>c.alive);
    const c=alive[Math.floor(Math.random()*alive.length)];
    eggs.push({x:c.x,y:c.y+12,v:150+Math.min(level*2,100),r:5});
    eggTimer=Math.max(.35,1.5-level*.012);
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.y-=b.v*dt;
    if(b.y<-20){bullets.splice(i,1);continue}
    let hit=false;
    for(const c of chickens){
      if(!c.alive)continue;
      if(Math.abs(b.x-c.x)<c.r+5&&Math.abs(b.y-c.y)<c.r+5){
        c.alive=false;hit=true;score+=10;
        addParticles(c.x,c.y,"hsl("+c.hue+",100%,65%)",8);
        soundChicken();
        break;
      }
    }
    if(hit)bullets.splice(i,1);
  }

  for(let i=eggs.length-1;i>=0;i--){
    const e=eggs[i];e.y+=e.v*dt;
    if(Math.hypot(e.x-player.x,e.y-player.y)<player.r+e.r){
      eggs.splice(i,1);loseHealth(8);
      addParticles(player.x,player.y,"#ff4b68",12);
      continue;
    }
    if(e.y>H+10)eggs.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }

  if(chickens.length && chickens.every(c=>!c.alive)){
    score+=chickens.length*5;
    nextLevel();
  }
  updateHUD();
}

function drawChicken(c){
  const bob=Math.sin(c.phase)*2;
  ctx.save();ctx.translate(c.x,c.y+bob);
  ctx.shadowColor="hsl("+c.hue+",100%,60%)";ctx.shadowBlur=10;

  // Wings
  ctx.fillStyle="hsl("+c.hue+",85%,52%)";
  ctx.beginPath();ctx.ellipse(-11,3,7,5,-.4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(11,3,7,5,.4,0,Math.PI*2);ctx.fill();

  // Body and head
  ctx.fillStyle="hsl("+c.hue+",90%,65%)";
  ctx.beginPath();ctx.ellipse(0,4,11,10,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-5,8,0,Math.PI*2);ctx.fill();

  // Comb
  ctx.fillStyle="#ff435e";
  ctx.beginPath();ctx.arc(-3,-12,3,0,Math.PI*2);ctx.arc(2,-13,3,0,Math.PI*2);ctx.fill();

  // Eyes and beak
  ctx.shadowBlur=0;
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(-3,-6,2.3,0,Math.PI*2);ctx.arc(3,-6,2.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#101020";
  ctx.beginPath();ctx.arc(-2.5,-6,1,0,Math.PI*2);ctx.arc(3.5,-6,1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffd447";
  ctx.beginPath();ctx.moveTo(-2,-2);ctx.lineTo(3,-2);ctx.lineTo(0,2);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawShip(){
  const upgrade=Math.min(level-1,20);
  ctx.save();ctx.translate(player.x,player.y);
  ctx.shadowColor="#00eaff";ctx.shadowBlur=18;

  // Side wings
  ctx.fillStyle=upgrade>4?"#ffb52e":"#087dff";
  ctx.beginPath();ctx.moveTo(-10,8);ctx.lineTo(-23,17);ctx.lineTo(-18,-5);ctx.lineTo(-8,-8);ctx.fill();
  ctx.beginPath();ctx.moveTo(10,8);ctx.lineTo(23,17);ctx.lineTo(18,-5);ctx.lineTo(8,-8);ctx.fill();

  // Main ship
  const gradient=ctx.createLinearGradient(0,-25,0,20);
  gradient.addColorStop(0,upgrade>7?"#fff06a":"#b8ffff");
  gradient.addColorStop(.45,upgrade>7?"#ff7b22":"#00dfff");
  gradient.addColorStop(1,"#1248ff");
  ctx.fillStyle=gradient;
  ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(12,9);ctx.lineTo(6,17);ctx.lineTo(-6,17);ctx.lineTo(-12,9);ctx.closePath();ctx.fill();

  // Cockpit
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.ellipse(0,-7,4,9,0,0,Math.PI*2);ctx.fill();

  // Engine flames
  ctx.shadowColor="#ff7a00";ctx.shadowBlur=15;
  ctx.fillStyle="#ff9d28";
  ctx.beginPath();ctx.moveTo(-5,13);ctx.lineTo(0,27+Math.random()*4);ctx.lineTo(5,13);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#080d25");bg.addColorStop(1,"#101c42");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  for(const s of stars){
    ctx.globalAlpha=.35+s.s*.25;
    ctx.fillStyle="#b7eaff";
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;

  // Subtle upper formation zone.
  ctx.fillStyle="#16396a18";
  ctx.fillRect(0,82,W,Math.min(220,H*.36));

  for(const c of chickens)if(c.alive)drawChicken(c);

  for(const b of bullets){
    ctx.shadowColor="#00f6ff";ctx.shadowBlur=12;
    ctx.fillStyle="#c5ffff";
    ctx.fillRect(b.x-2,b.y-9,4,14);
  }
  ctx.shadowBlur=0;

  for(const e of eggs){
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(e.y*.03)*.2);
    ctx.fillStyle="#fff1c5";ctx.strokeStyle="#ffbd59";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(0,0,5,7,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
  }

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;

  if(started&&!gameOver)drawShip();

  // VIP rank indicator
  if(started&&!gameOver){
    ctx.font="bold 11px Arial";ctx.textAlign="center";
    ctx.fillStyle="#ffe76b";
    ctx.fillText("VIP "+level,player.x,player.y+35);
  }
}
function loop(t){
  const dt=Math.min(.035,(t-(lastTime||t))/1000);
  lastTime=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}

// Touch and mouse movement: drag anywhere to move.
let dragging=false;
function movePlayer(e){
  if(!started||gameOver)return;
  player.x=clamp(e.clientX,22,W-22);
}
canvas.addEventListener("pointerdown",e=>{
  initAudio();
  if(!started||gameOver){
    newGame();return;
  }
  dragging=true;
  movePlayer(e);
});
canvas.addEventListener("pointermove",e=>{
  if(dragging)movePlayer(e);
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointercancel",()=>dragging=false);

$("settingsBtn").addEventListener("click",()=>{
  initAudio();
  settingsOpen=true;
  $("settings").style.display="block";
});
$("resumeBtn").addEventListener("click",()=>{
  settingsOpen=false;
  $("settings").style.display="none";
});
function setToggle(name,button){
  settings[name]=!settings[name];
  button.textContent=settings[name]?"ON":"OFF";
  if(name==="music"){
    if(settings.music){initAudio();startMusic()}else stopMusic();
  }
  updateSoundButton();
}
$("musicToggle").addEventListener("click",()=>setToggle("music",$("musicToggle")));
$("chickenToggle").addEventListener("click",()=>setToggle("chicken",$("chickenToggle")));
$("bulletToggle").addEventListener("click",()=>setToggle("bullets",$("bulletToggle")));

function updateSoundButton(){
  const all=settings.music&&settings.chicken&&settings.bullets;
  $("soundBtn").textContent="SOUND: "+(all?"ON":"CUSTOM");
}
$("soundBtn").addEventListener("click",()=>{
  initAudio();
  const turnOn=!(settings.music&&settings.chicken&&settings.bullets);
  settings.music=turnOn;settings.chicken=turnOn;settings.bullets=turnOn;
  $("musicToggle").textContent=turnOn?"ON":"OFF";
  $("chickenToggle").textContent=turnOn?"ON":"OFF";
  $("bulletToggle").textContent=turnOn?"ON":"OFF";
  if(turnOn)startMusic();else stopMusic();
  updateSoundButton();
});

window.addEventListener("resize",()=>{
  resize();makeStars();
  if(started&&!gameOver)spawnWave();
});

resize();makeStars();
$("message").innerHTML="VIP CHICKEN SHOOTER<br><span style='font-size:15px'>TAP TO START</span>";
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
